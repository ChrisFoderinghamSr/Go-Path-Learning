AWSTemplateFormatVersion: '2010-09-09'
Description: Go Path single-writer GitHub student service
Parameters:
  Vpc: {Type: 'AWS::EC2::VPC::Id'}
  SubnetA: {Type: 'AWS::EC2::Subnet::Id'}
  SubnetB: {Type: 'AWS::EC2::Subnet::Id'}
  Image: {Type: String}
  CertificateArn: {Type: String}
  OAuthSecretArn: {Type: String}
  Hostname: {Type: String}
  Reviewers: {Type: String, AllowedPattern: '[0-9]+(,[0-9]+)*'}
Resources:
  Cluster: {Type: 'AWS::ECS::Cluster'}
  Logs:
    Type: AWS::Logs::LogGroup
    Properties: {RetentionInDays: 30}
  EdgeSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS
      VpcId: !Ref Vpc
      SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0}]
  AppSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Application traffic only from load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref EdgeSG}]
  DataSG:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: NFS only from student service
      VpcId: !Ref Vpc
      SecurityGroupIngress: [{IpProtocol: tcp, FromPort: 2049, ToPort: 2049, SourceSecurityGroupId: !Ref AppSG}]
  Data:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Encrypted: true
      BackupPolicy: {Status: ENABLED}
  MountA:
    Type: AWS::EFS::MountTarget
    Properties: {FileSystemId: !Ref Data, SubnetId: !Ref SubnetA, SecurityGroups: [!Ref DataSG]}
  MountB:
    Type: AWS::EFS::MountTarget
    Properties: {FileSystemId: !Ref Data, SubnetId: !Ref SubnetB, SecurityGroups: [!Ref DataSG]}
  Access:
    Type: AWS::EFS::AccessPoint
    Properties:
      FileSystemId: !Ref Data
      PosixUser: {Uid: '65532', Gid: '65532'}
      RootDirectory:
        Path: /students
        CreationInfo: {OwnerUid: '65532', OwnerGid: '65532', Permissions: '700'}
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement: [{Effect: Allow, Principal: {Service: ecs-tasks.amazonaws.com}, Action: 'sts:AssumeRole'}]
      ManagedPolicyArns: [!Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy']
      Policies:
        - PolicyName: OAuthSecret
          PolicyDocument:
            Version: '2012-10-17'
            Statement: [{Effect: Allow, Action: 'secretsmanager:GetSecretValue', Resource: !Ref OAuthSecretArn}]
  Task:
    Type: AWS::ECS::TaskDefinition
    Properties:
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: '256'
      Memory: '512'
      ExecutionRoleArn: !GetAtt Role.Arn
      Volumes:
        - Name: records
          EFSVolumeConfiguration:
            FilesystemId: !Ref Data
            TransitEncryption: ENABLED
            AuthorizationConfig: {AccessPointId: !Ref Access}
      ContainerDefinitions:
        - Name: school
          Image: !Ref Image
          Essential: true
          PortMappings: [{ContainerPort: 8080}]
          MountPoints: [{SourceVolume: records, ContainerPath: /data}]
          Environment:
            - {Name: PUBLIC_ORIGIN, Value: !Sub 'https://${Hostname}'}
            - {Name: REVIEWER_GITHUB_IDS, Value: !Ref Reviewers}
          Secrets:
            - {Name: GITHUB_CLIENT_ID, ValueFrom: !Sub '${OAuthSecretArn}:GITHUB_CLIENT_ID::'}
            - {Name: GITHUB_CLIENT_SECRET, ValueFrom: !Sub '${OAuthSecretArn}:GITHUB_CLIENT_SECRET::'}
          LogConfiguration:
            LogDriver: awslogs
            Options: {awslogs-group: !Ref Logs, awslogs-region: !Ref 'AWS::Region', awslogs-stream-prefix: school}
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties: {Scheme: internet-facing, SecurityGroups: [!Ref EdgeSG], Subnets: [!Ref SubnetA, !Ref SubnetB]}
  Targets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties: {Port: 8080, Protocol: HTTP, TargetType: ip, VpcId: !Ref Vpc, HealthCheckPath: /healthz}
  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 443
      Protocol: HTTPS
      Certificates: [{CertificateArn: !Ref CertificateArn}]
      DefaultActions: [{Type: forward, TargetGroupArn: !Ref Targets}]
  Service:
    Type: AWS::ECS::Service
    DependsOn: [Listener, MountA, MountB]
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref Task
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: '1.4.0'
      DeploymentConfiguration: {MaximumPercent: 100, MinimumHealthyPercent: 0}
      NetworkConfiguration:
        AwsvpcConfiguration: {AssignPublicIp: ENABLED, Subnets: [!Ref SubnetA, !Ref SubnetB], SecurityGroups: [!Ref AppSG]}
      LoadBalancers: [{ContainerName: school, ContainerPort: 8080, TargetGroupArn: !Ref Targets}]
Outputs:
  LoadBalancerDNS: {Value: !GetAtt ALB.DNSName}
  HealthURL: {Value: !Sub 'https://${Hostname}/healthz'}
